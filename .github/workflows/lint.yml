name: Lint
on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          only-new-issues: true
